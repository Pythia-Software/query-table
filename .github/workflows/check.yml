name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Full gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          # The SQLite tests use the newest toolchain in the repository.
          go-version-file: backends/sqlite-tests/go.mod
          cache-dependency-path: backends/**/go.sum
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      # The local pre-push hook skips the SQLite race suite unless backend or
      # wire files changed. This run is what covers it for every change.
      - name: Run the full gate
        run: npm run check
      - name: Build packages
        run: npm run build:packages
