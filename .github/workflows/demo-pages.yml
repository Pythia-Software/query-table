name: Public demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify DuckDB execution
        run: npm run test:duckdb
      - name: Build from current library source
        run: npm run build:showcase
      - name: Install the browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Verify guided tours, saved queries and static subpath hosting
        run: npm run test:showcase
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist-showcase
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy static demo
        id: deployment
        uses: actions/deploy-pages@v4
