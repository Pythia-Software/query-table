name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    if: github.repository == 'Pythia-Software/query-table'
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Require the tagged commit to be on main
        run: git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an OIDC-capable npm version
        run: npm install --global npm@11.6.1
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backends/go/go.mod
          cache: false
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: Match package versions to the tag
        run: npm run version:check -- "${GITHUB_REF_NAME}"
      - name: Run the release gate
        run: npm run release:check
      - name: Publish packages in dependency order
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          version="${RELEASE_VERSION#v}"
          publish_workspace() {
            package_name="$1"
            if npm view "${package_name}@${version}" version >/dev/null 2>&1; then
              echo "${package_name}@${version} is already published; skipping."
            else
              npm publish --workspace "${package_name}" --access public
            fi
          }
          publish_workspace "@pythia-software/query-table-core"
          publish_workspace "@pythia-software/query-table-react"
          publish_workspace "@pythia-software/query-table-ui"
          publish_workspace "@pythia-software/query-table-codegen"

  tag-go-module:
    name: Tag Go module
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The Go module lives in backends/go, so the Go toolchain only recognizes
      # tags carrying that prefix. The root v* tag alone yields pseudo-versions.
      - name: Create backends/go tag
        env:
          GH_TOKEN: ${{ github.token }}
          GO_TAG: backends/go/${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Matching refs returns [] for a missing tag, without a 404 response
          # body that could be mistaken for an existing object. Match exactly
          # because this endpoint can also return tags with the same prefix.
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${GO_TAG}" |
            jq -r --arg ref "refs/tags/${GO_TAG}" '.[] | select(.ref == $ref) | .object.type + " " + .object.sha')"
          if [ "${existing%% *}" = "tag" ]; then
            existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${existing#* }" --jq .object.sha)"
          else
            existing="${existing#* }"
          fi
          if [ -z "${existing}" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/${GO_TAG}" -f "sha=${GITHUB_SHA}" >/dev/null
            echo "Created ${GO_TAG} at ${GITHUB_SHA}."
          elif [ "${existing}" = "${GITHUB_SHA}" ]; then
            echo "${GO_TAG} already points at ${GITHUB_SHA}; skipping."
          else
            echo "::error::${GO_TAG} already points at ${existing}, not ${GITHUB_SHA}."
            exit 1
          fi
      - name: Ask the Go module proxy to index the version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors \
            "https://proxy.golang.org/github.com/!pythia-!software/query-table/backends/go/@v/${RELEASE_VERSION}.info"
